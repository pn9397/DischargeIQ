  }
  if (patient.insurance === 'ramq') {
    addRec('priority', ' Insurance Hard Rule — RAMQ (Quebec) Patient', [
      { text: 'Patients with RAMQ insurance are NOT eligible for TOH rehabilitation programs. Repatriate to home hospital in Quebec for consideration of rehabilitation. If discharging home to Quebec, refer to Quebec home care services as required. All other non-rehab discharge options apply.', referral: 'Repatriation Order in Epic' }
    ], 'ins_ramq');
  }
  if (patient.insurance === 'uninsured') {
    addRec('priority', ' Insurance Hard Rule — Uninsured Patient', [
      { text: 'This patient has no insurance. Refer to the TOH Policy for Uninsured Patients. The patient must be presented to the Uninsured Patient Panel to approve ongoing admission beyond life-saving measures. Discharge planning must proceed in parallel with panel review.', referral: 'TOH Uninsured Patient Policy' }
    ], 'ins_uninsured');
  }
  if (patient.insurance === 'ifh') {
    addRec('information', 'Insurance Note — Interim Federal Health (IFH) Patient', [
      { text: 'All standard discharge options apply EXCEPT Long-Term Care (LTC). If LTC is the only viable discharge option, this patient will need to remain on a Transitional Care Unit until they become a Canadian citizen with access to OHIP.' }
    ], 'ins_ifh');
  }
  if (patient.insurance === 'private') {
    addRec('recommended', ' Insurance Hard Rule — Private Coverage Only (Non-OHIP)', [
      { text: 'This patient has private coverage only and is NOT eligible for OHIP-funded publicly insured services. This categorically excludes the following discharge destinations from the publicly funded pathway:' },
      { text: 'Home care (OHAH/CCAC) — not funded. Any home care required must be arranged and paid for privately by the patient or family.', referral: 'Private Home Care Resource' },
      { text: 'Long-Term Care (LTC) — OHIP-funded LTC is not available. Private-pay LTC placement may be explored depending on facility and availability.', referral: 'SW Consult in Epic' },
      { text: 'Hospice — OHIP-funded hospice beds are not accessible. Private hospice or palliative options must be explored.' },
      { text: 'Inpatient Rehabilitation — TOH rehab programs require provincial health coverage. Patient is not eligible.' },
      { text: 'All remaining discharge planning must be structured as private-pay. SW consult required to assist the patient and family with navigating private coverage, verifying insurance benefit details and limitations, and identifying available private-pay options.', referral: 'SW Consult in Epic' },
      { text: 'If private coverage is found to be inadequate or does not cover required services, refer to the TOH Uninsured Patients Policy and present to the Uninsured Patient Panel as appropriate.', referral: 'TOH Uninsured Patient Policy' },
    ], 'ins_private');
  }

  /* ---- MOBILITY BARRIER ---- */
  if (barriers.mobility?.selected) {
    const improve = barriers.mobility.likelyImprove;
    const living = patient.livingEnv;
    const prog = patient.prognosis;

    if (living === 'ltc') {
      addRec('priority', 'Return to Home LTC', [
        { text: 'Patient should be discharged back to their home Long-Term Care facility, where rehabilitation goals and increased care needs can be addressed within their existing care team. The patient has 31 days to return before losing their LTC bed. No hospital PT/OT/SW consult is required for this pathway.' }
      ], 'mob_ltc');
    } else if (improve === 'yes') {
      if (living === 'shelter') {
        addRec('priority', 'Submit Subacute Consult — Inpatient Rehabilitation (Unhoused Patient)', [
          { text: 'Patients without stable housing who have active rehab goals and are participating with PT/OT may benefit from inpatient rehab to improve quality of life and function.', referral: 'Subacute Consult Team in Epic' },
          { text: 'Available rehab programs in Ottawa: Neurospinal, Acquired Brain Injury/Behavioural Rehabilitation Service, Complex Orthopedic Rehab, Respiratory (usually outpatient), Short Term Rehabilitation, Stroke Rehab (Bruyère), Geriatric Rehabilitation (Bruyère), Slow Stream Rehab (SVH). Peripheral hospitals have rehab available — contact Bed Flow to repatriate if appropriate.' },
          { text: 'Once accepted to rehab, Transitional Care auto-accepts and patient is waitlisted for a TOH TCU bed while awaiting rehab offer. Ensure patient/family are aware of possible transfer including to Transitional Care Centre (1095 Carling Ave). Wait times are variable.', referral: 'TOH TCU Consult in Epic' },
          { text: 'If declined from rehab team, re-complete the tool selecting Mobility/Functional Improvement: NO.' }
        ], 'mob_yes_shelter');
      } else {
        addRec('priority', 'Submit Subacute Consult — Inpatient Rehabilitation', [
          { text: 'This patient has mobility/functional impairment that is likely to improve. Inpatient rehabilitation is the recommended pathway.', referral: 'Subacute Consult Team in Epic' },
          { text: 'Available rehab programs in Ottawa: Neurospinal, Acquired Brain Injury/Behavioural Rehabilitation Service, Complex Orthopedic Rehab, Respiratory (usually outpatient), Short Term Rehabilitation, Stroke Rehab (Bruyère), Geriatric Rehabilitation (Bruyère), Slow Stream Rehab (SVH). Peripheral hospitals have rehab available — contact Bed Flow and repatriate if appropriate.' },
          { text: 'Once accepted to rehab, Transitional Care auto-accepts and patient is waitlisted for a TOH TCU bed while awaiting rehab bed offer. Ensure patient/family are aware of possible transfer including to the offsite Transitional Care Centre (1095 Carling Ave). Wait times are variable.', referral: 'TOH TCU Consult in Epic' },
          { text: 'If declined by rehab team: re-complete this tool selecting Mobility/Functional Improvement: NO.' }
        ], 'mob_yes_home');
      }
    } else if (improve === 'unknown') {
      if (living === 'ltc') {
        addRec('priority', 'Return to Home LTC', [
          { text: 'Patient should be discharged back to home LTC. The facility can address rehabilitation assessment and increased care needs. Patient has 31 days to return before losing their LTC bed.' }
        ], 'mob_unk_ltc');
      } else if (prog === 'years') {
        addRec('recommended', 'Recovery Trial — 1 to 2 Week Supervised Mobility Assessment', [
          { text: 'Mobility improvement potential is unclear. A time-limited 1–2 week recovery trial focused on maximizing mobility is recommended to determine eligibility for inpatient rehabilitation.' },
          { text: 'Active engagement during this period is essential. The care team should clearly communicate expectations and goals to patient/family. Consider consulting the Mobility Team for daily mobilization support (e.g., chair transfer, ambulation). Ensure pain and medical barriers to progress are addressed.' },
          { text: 'If meaningful progress: apply to Subacute/inpatient rehab. If no progress or patient reaches new baseline, initiate discharge planning with appropriate supports.', referral: 'Subacute Consult Team in Epic' },
          { text: 'If no improvement confirmed: re-complete this tool selecting Mobility/Functional Improvement: NO.' }
        ], 'mob_unk_years');
      } else {
        // Unknown + weeks/months — treat as NOT improve
        generateNotImproveMobility(patient, recs, prog, living, 'mob_unk_other');
      }
    } else if (improve === 'no') {
      if (living === 'ltc') {
        addRec('priority', 'Return to Home LTC', [
          { text: 'Patient should be discharged back to home LTC. Mobility/functional decline does not preclude LTC care. Patient has 31 days to return before losing their LTC bed.' }
        ], 'mob_no_ltc');
      } else {
        generateNotImproveMobility(patient, recs, prog, living, 'mob_no');
      }
    }
  }

  /* ---- LIVING ENVIRONMENT UNSUITABLE ---- */
  if (barriers.livingEnv?.selected) {
    const subtypes = barriers.livingEnv.subtypes || [];
    const hasHoarding = subtypes.includes('hoarding');
    const hasStairs = subtypes.includes('stairs');
    const hasAlone = subtypes.includes('alone');
    const hasHighCare = subtypes.includes('high_care');
    const temp = barriers.livingEnv.temporary;

    if (hasHoarding) {
      falseBarriers.push({
        label: 'Hoarding / Uncleanliness',
        message: 'Hoarding or uncleanliness (including pest control) is a FALSE BARRIER. This alone should not delay discharge. Discharge should only be delayed if the patient would be at risk of imminent and serious bodily harm. If the patient is capable and accepting of this risk, they cannot be confined against their will. Social Work may assist with connecting the patient to community cleaning services or public health, but this must not delay discharge.'
      });
    }

    if (hasStairs) {
      const improve = barriers.mobility?.likelyImprove;
      const prog = patient.prognosis;
      if (improve === 'yes' || (improve === 'unknown' && prog === 'years')) {
        addRec('recommended', 'Home Modifications — Inaccessible Environment + Improving Mobility', [
          { text: 'CCL to consult OT for home safety assessment and recommendations for modifications (e.g., ramps, stair lifts, grab bars). Patient/family to arrange modifications prior to discharge.', referral: 'OT Consult in Epic' },
          { text: 'If modifications cannot be completed before discharge, consider temporary placement in an accessible retirement home or convalescent setting while modifications are arranged.' },
          { text: 'If rehab goals exist, inpatient rehab may provide time for home modifications to be organized.', referral: 'Subacute Consult Team in Epic' }
        ], 'env_stairs_improve');
      } else {
        addRec('recommended', 'Permanent Accessible Relocation — Inaccessible Environment + Functional Impairment', [
          { text: 'Patient/family to identify an accessible living arrangement (ground-floor apartment, accessible retirement home). CCL can provide a list of accessible retirement homes and no-cost placement agencies (e.g., Tea and Toast).', referral: 'Tea and Toast Referral Form' },
          { text: 'If patient can manage with equipment (e.g., stair lift, wheelchair ramp), OT to assess feasibility.', referral: 'OT Consult in Epic' },
          { text: 'CCL to consult OHAH for community home care support.', referral: 'OHAH Referral' }
        ], 'env_stairs_no');
        addRec('option', 'Long-Term Care (Last Resort)', [
          { text: 'If accessible living and home care are not viable. Per home-first philosophy, LTC placement is the option of last resort. Requires SW consult for OHAH discussion and JDO approval.', referral: 'SW Consult in Epic' }
        ], 'env_stairs_ltc');
      }
    }

    if (hasAlone && hasHighCare) {
      addRec('recommended', 'Home with Home Care ± Private-Pay Support — Living Alone with High Care Needs', [
        { text: 'OHAH can provide approximately 3 hours/day of support. Patient/family should supplement with private supports for care needs that exceed publicly funded maximums.', referral: 'OHAH Referral' },
        { text: 'YCAH may also be an option.', referral: 'YCAH Referral (SW)' }
      ], 'env_alone_care');
      addRec('option', 'Retirement Home with Home Care', [
        { text: 'Provides built-in socialization and meal services with on-site staff available. Private funds required. CCL to provide retirement home list and no-cost placement agencies.', referral: 'Tea and Toast Referral' }
      ], 'env_alone_rh');
      addRec('option', 'Long-Term Care (Last Resort)', [
        { text: 'If care needs exceed what community supports can provide. Per home-first philosophy, LTC is the option of last resort. Requires SW consult.', referral: 'SW Consult in Epic' }
      ], 'env_alone_ltc');
    }

    if (temp === 'yes') {
      addRec('information', 'Temporary Living Environment Barrier', [
        { text: 'The living environment barrier is anticipated to be temporary (e.g., temporarily non-weight-bearing). Ensure a clear timeline is communicated and discharge planning is initiated now. Consider convalescent care or short-term rehabilitation while patient awaits return to home environment.' }
      ], 'env_temp');
    }
  }

  /* ---- INCREASED CARE NEEDS ---- */
  if (barriers.careNeeds?.selected) {
    const needs = barriers.careNeeds.types || [];

    if (needs.includes('housekeeping')) {
      falseBarriers.push({
        label: 'Housekeeping / Pest Control',
        message: 'Assistance with deep cleaning or pest control is a FALSE BARRIER. OHAH can provide light housekeeping only when ADL services are also required. Deep cleaning and pest extermination are not provided by the hospital or OHAH. Social Work may assist with connecting the patient to community cleaning services, but this must not delay discharge. Discharge should only be delayed if the patient would be at immediate risk of serious bodily harm in the home environment.'
      });
    }

    if (needs.includes('transport_appt')) {
      falseBarriers.push({
        label: 'Assistance with Transportation to Appointments',
        message: 'The hospital is NOT required to provide transport home (including to LTC) at discharge or to appointments after discharge. See: Para-Transpo application, private car services, and medical transport companies resources.'
      });
    }

    const hasADL_basic = needs.includes('adl_dressing') || needs.includes('adl_bathing');
    const hasADL_complex = needs.includes('adl_toileting_feeding') || needs.includes('adl_meds') || needs.includes('adl_supervision');
    const hasGrocery = needs.includes('adl_grocery');
    const hasIADL = needs.includes('iadl');

    if (hasADL_basic && !hasADL_complex) {
      addRec('recommended', 'Home with Home Care — ADL Assistance (Dressing/Bathing)', [
        { text: 'Maximal home support through home care is generally 3 hours/day. Home care can assist with morning/evening routine and bathing. Visiting PSWs can assist with medication cueing but cannot administer medications.', referral: 'OHAH Referral' },
        { text: 'YCAH may also be an option.', referral: 'YCAH Referral (SW)' },
        { text: 'Patient/family may supplement with private paid supports.', referral: 'Private Supports Resource' }
      ], 'care_adl_basic');
      addRec('option', 'Retirement Home with Home Care', [
        { text: 'Appropriate if supports available in previous living environment are insufficient. Can be considered as respite or permanent relocation. Patient/family to choose location. CCL can provide list and no-cost agencies.', referral: 'Tea and Toast Referral' }
      ], 'care_adl_basic_rh');
      addRec('option', 'Long-Term Care (Last Resort)', [
        { text: 'Per home-first philosophy, LTC is the option of last resort. Requires SW consult for OHAH discussion and JDO approval.', referral: 'SW Consult in Epic' }
      ], 'care_adl_basic_ltc');
    }

    if (hasADL_complex) {
      addRec('recommended', 'Home with Home Care + 24/7 Private-Pay Support', [
        { text: 'OHAH provides up to approximately 3 hours/day for morning/evening routine. However, assistance with toileting/feeding, medication administration, or 24/7 supervision requires private-pay caregiver support beyond publicly funded maximums.', referral: 'OHAH Referral' },
        { text: 'YCAH may also be an option.', referral: 'YCAH Referral (SW)' },
        { text: 'Patient may require a memory unit if wandering with significant wayfinding issues.' },
        { text: 'Patient/family may supplement with 24/7 private supports.', referral: 'Private Supports Resource' }
      ], 'care_adl_complex');
      addRec('option', 'Retirement Home with Home Care (Memory Unit if Required)', [
        { text: 'Appropriate if previous living environment is no longer sufficient. Private funds required. CCL to provide list and no-cost placement agencies.', referral: 'Tea and Toast Referral' }
      ], 'care_complex_rh');
      addRec('option', 'Long-Term Care (Last Resort)', [
        { text: 'Per home-first philosophy, LTC placement from hospital is the option of last resort. Requires SW consult for OHAH discussion and JDO approval. Patient/family to be advised that patient cannot await LTC from hospital and will require transfer to TOH TCU or external TCU.', referral: 'SW Consult in Epic' },
        { text: 'External TCU options available (e.g., Greystone TCU, Bruyère TCU).', referral: 'External TCU Referral' }
      ], 'care_complex_ltc');
    }

    if (hasGrocery && !hasADL_basic && !hasADL_complex) {
      addRec('information', 'Grocery / Meal Preparation Support', [
        { text: 'Patient/family can apply for Meals on Wheels or home food delivery services. This should not delay discharge. OHAH can assist if also providing ADL services.' }
      ], 'care_grocery');
    }

    if (hasIADL) {
      addRec('recommended', 'Social Work Consult — iADL Needs Requiring PG&T', [
        { text: 'For iADL needs that exceed what family and home care can provide, a Social Work consult is required to involve the Public Guardian and Trustee (PG&T) as appropriate.', referral: 'SW Consult in Epic' }
      ], 'care_iadl');
    }
  }

  /* ---- DISAGREEMENT / DELAY ---- */
  if (barriers.disagreement?.selected) {
    const capacity = barriers.disagreement.hasCapacity;
    const sdmAgrees = barriers.disagreement.sdmAgrees;

    if (capacity === 'no') {
      // ── Subcase A: No SDM identified or SDM unavailable ──────────────────────
      if (sdmAgrees === 'no_sdm') {
        addRec('priority', 'No SDM Identified — Public Guardian and Trustee (PG&T) Required', [
          { text: 'Patient lacks capacity to make a discharge decision AND no substitute decision maker has been identified or is available. Social Work consult is required immediately to initiate involvement of the Public Guardian and Trustee (PG&T) as the statutory SDM.', referral: 'SW Consult in Epic (Urgent)' },
          { text: 'The PG&T is empowered under the Substitute Decisions Act to make discharge and placement decisions on behalf of an incapable patient when no other authorized SDM exists. PG&T will act in accordance with the patient\'s known prior capable wishes, or if unknown, in the patient\'s best interest.' },
          { text: 'Critical: Do NOT pause or delay discharge planning while awaiting PG&T involvement. The care team must actively prepare a documented set of discharge options — with supporting rationale for each — so that PG&T can review and make a decision promptly upon engagement. Planning delays while awaiting PG&T are not clinically appropriate.' },
          { text: 'CCL to document all barrier assessments, discharge options explored, and clinical context in the chart ahead of PG&T contact. SW will coordinate the formal referral and communication with PG&T.' },
        ], 'disagree_no_sdm');
      }
      // ── Subcase B: SDM present but disagrees with discharge plan ─────────────
      else if (sdmAgrees === 'no') {
        addRec('priority', 'SDM Disagrees with Discharge Plan — Escalation Pathway', [
          { text: 'Patient lacks capacity. The Substitute Decision Maker (SDM) is not in agreement with the proposed discharge plan. The SDM\'s legal obligation is to make decisions in accordance with the patient\'s known prior capable wishes. If those wishes are unknown, the SDM must act in the patient\'s best interest — not in the SDM\'s own interest or based on personal preferences.' },
          { text: 'If it appears that the SDM is NOT acting in accordance with the patient\'s known wishes or best interest, the matter should be referred to the Consent and Capacity Board (CCB) process. The CCB has the authority to review SDM decisions and issue binding orders.', referral: 'Consent and Capacity Board Referral' },
          { text: 'SW to support structured family meetings and mediation to clarify the legal framework, the patient\'s documented wishes, and the available discharge options. Early, transparent communication can resolve many SDM disagreements before formal escalation is required.', referral: 'SW Consult in Epic' },
          { text: 'If the discharge delay becomes prolonged, escalate to the unit director per TOH Discharge Policy. Document all communication with the SDM, the clinical rationale for discharge, and each step taken to resolve the disagreement.' },
          { text: 'Note: Peripheral opinions of family members who are NOT the legal SDM have no authority over the discharge decision. Only the designated SDM\'s agreement is required.' },
        ], 'disagree_sdm_no');
      }
      // ── Subcase C: SDM present and agrees ───────────────────────────────────
      else if (sdmAgrees === 'yes') {
        addRec('information', 'Patient Lacks Capacity — SDM in Agreement', [
          { text: 'Patient lacks capacity and the designated SDM is in agreement with the proposed discharge plan. Proceed with discharge planning in full partnership with the SDM.' },
          { text: 'Ensure the formal capacity assessment is documented clearly in the chart by the MRP, including the specific decision for which the patient lacks capacity. Document the SDM\'s identity, their relationship to the patient, and their explicit agreement with the discharge plan.', referral: 'Capacity Assessment Resource' },
          { text: 'Continue advancing the discharge plan. The SDM\'s agreement satisfies the consent requirement for discharge planning in an incapable patient.' },
        ], 'disagree_no_cap_agree');
      }
      // Cognitive impairment context — capacity assessment resource always surfaced
      addRec('information', 'Capacity Assessment — Clinical Resource', [
        { text: 'A formal capacity assessment for the specific discharge decision can be completed by the MRP at any time. This assessment is decision-specific: a patient may lack capacity for one decision (e.g., selecting a discharge destination) while retaining capacity for others. Document the assessment, the specific decision, the evidence reviewed, and the conclusion clearly in the chart.', referral: 'Capacity Assessment Resource' },
      ], 'disagree_capacity_resource');

    } else if (capacity === 'yes') {
      // ── Subcase D: Patient has capacity, refuses all options ─────────────────
      if (sdmAgrees === 'no') {
        addRec('priority', 'Capable Patient Refuses All Discharge Options — Escalation Required', [
          { text: 'The patient has been assessed as having capacity to make discharge decisions and has been presented with all available and clinically appropriate discharge options. The patient has declined all options and wishes to remain in hospital.' },
          { text: 'Step 1 — Document: Record in the chart that the patient was informed of all available discharge options, the clinical rationale for discharge, and that the patient declined each option. This documentation is essential for policy escalation and protects the clinical team.', },
          { text: 'Step 2 — 48-Hour Notification: The patient must be formally informed of the TOH 48-hour decision timeline. Once medical clearance for discharge is established, the patient and family have 48 hours to reach a decision on a discharge option, including the selection of a retirement home. This is a policy-based timeline, not a clinical one.', referral: 'TOH Discharge Policy' },
          { text: 'Step 3 — Escalate to Unit Director: Per TOH Discharge Policy, escalate the case to the unit director for consideration of the application of a daily co-payment for discharge delays. The unit director will initiate the formal escalation process. This is not a clinical decision — it is a hospital policy mechanism.', referral: 'TOH Discharge Policy (SharePoint)' },
          { text: 'Step 4 — Ethics Consult (if appropriate): An ethics consult may be appropriate if the refusal involves competing values, complex family dynamics, or if the team is uncertain about how to proceed. Ethics consultation does not override the patient\'s autonomous decision but can help navigate difficult conversations.', referral: 'Ethics Consult' },
          { text: 'Note: A capable patient\'s refusal of a preferred discharge option is not, by itself, a reason to delay escalation. The policy framework applies as soon as medical readiness for discharge is established and all options have been presented.' },
        ], 'disagree_capable_refuse');
      }
      // ── Subcase E: Patient has capacity, agrees — peripheral opinions only ───
      else {
        addRec('information', 'Peripheral Family Opinions — Not a Barrier to Discharge', [
          { text: 'The patient has capacity and is in agreement with the discharge plan. Peripheral opinions of family members or others who are NOT the patient\'s legal substitute decision maker do not constitute a barrier to discharge and cannot override the patient\'s autonomous decision.' },
          { text: 'Proceed with discharge planning as agreed with the patient. If family members express concerns, acknowledge their perspective respectfully while clarifying the patient\'s right to make their own discharge decision. Document the patient\'s agreement and the family concerns in the chart.' },
        ], 'disagree_peripheral');
      }

    } else {
      // ── Subcase F: Capacity unknown ─────────────────────────────────────────
      addRec('recommended', 'Capacity Assessment Required Before Discharge Planning Can Advance', [
        { text: 'The patient\'s decision-making capacity for the specific discharge decision has not been established. A formal capacity assessment must be completed by the MRP before discharge planning can meaningfully advance.' },
        { text: 'Capacity is decision-specific and time-specific. The MRP should assess whether the patient can: understand the information provided about discharge options, appreciate how it applies to their situation, reason through the options, and communicate a consistent decision.', referral: 'Capacity Assessment Resource' },
        { text: 'If the patient is found to have capacity: proceed with discharge planning with the patient as the primary decision maker.' },
        { text: 'If the patient is found to lack capacity: identify the appropriate SDM and return to this tool selecting the relevant SDM scenario above.' },
        { text: 'If there is evidence of cognitive impairment affecting capacity, consider geriatric psychiatry or cognitive assessment.', referral: 'Geriatric Psychiatry Consult in Epic' },
      ], 'disagree_unknown_cap');
    }
  }

  /* ---- PATIENT BEHAVIOURS ---- */
  if (barriers.behaviours?.selected) {
    const cause = barriers.behaviours.cause;

    if (cause === 'cognitive') {
      // Cross-reference: if patient has developmental delay and lives in a group home,
      // the correct pathway is the DD/group home protocol, NOT the dementia/geriatric one.
      // Source: Part 4 "Relevant Comorbidity: Developmental Delay — Living: Group home"
      if (patient.comorbidities?.includes('dev_delay') && patient.livingEnv === 'group_home') {
        addRec('recommended', 'Behavioural Management — Developmental Delay + Group Home', [
          { text: 'Patients with developmental delay who are medically stable but exhibit reactive behaviours in hospital (including requiring IM PRN medications for agitation) require careful planning and collaboration with the Group Home, Social Work, and available family/friends. A behavioural plan should be developed with a communicated transition timeline.', referral: 'SW Consult in Epic' },
          { text: 'Consider Psychiatry consult if appropriate — do not delay discharge planning while awaiting.', referral: 'Psychiatry Consult in Epic' },
          { text: 'MRP to place TOH TCU consult in Epic. It is important to move forward with discharge planning while awaiting acceptance and transfer to TCU — do not stall.', referral: 'TOH TCU Consult in Epic' },
          { text: 'Generally, patients with developmental delay need to be stable without IM antipsychotics for more than 3 months prior to LTC acceptance. Confirm this threshold with the accepting facility before referral.' },
          { text: 'Consider a behavioural contract for capable patients whose behaviours are interfering with care or discharge planning. Continued non-adherence may result in discharge.', referral: 'Behavioural Contract Template' },
        ], 'beh_dd_via_cognitive');
      } else {
        addRec('recommended', 'Behavioural Management — Cognitive Impairment / Dementia', [
          { text: 'Patients medically stable but exhibiting reactive behaviours (including requiring IM PRN medications for agitation) require optimization before discharge. Consultation with Geriatric Psychiatry and the Dementia Behavioural Support Team (DBST) is recommended to support in-hospital behavioural management.', referral: 'Geriatric Psychiatry Consult in Epic' },
          { text: 'GOAT Referral and Dementia Coach referral available.', referral: 'GOAT Referral / Dementia Coach' }
        ], 'beh_cognitive');
      }
    } else if (cause === 'substance') {
      addRec('recommended', 'Behavioural Management — Active Substance Use Disorder', [
        { text: 'MRP to consider referral to the Substance Use Program in Epic for management recommendations and assistance with discharge planning.', referral: 'Substance Use Program Consult in Epic' },
        { text: 'Consider a behavioural contract for capable patients whose behaviours are interfering with care or discharge planning. Continued non-adherence may result in discharge from hospital.', referral: 'Behavioural Contract Template' },
        { text: 'Review: TOH Alcohol Policy, TOH Cannabis Policy, TOH Smoking/Vaping Policy.', referral: 'TOH Substance Policies' }
      ], 'beh_substance');
    } else if (cause === 'dd') {
      addRec('recommended', 'Behavioural Management — Developmental Delay + Group Home', [
        { text: 'Patients with developmental delay and reactive behaviours (including IM PRN medications) require careful planning in collaboration with the group home, social work, and available family/friends. A behavioural plan should be developed with a communicated transition timeline.', referral: 'SW Consult in Epic' },
        { text: 'Consider psychiatry consult if appropriate.', referral: 'Psychiatry Consult in Epic' },
        { text: 'MRP to place TCU consult in Epic while advancing discharge planning in parallel.', referral: 'TOH TCU Consult in Epic' },
        { text: 'Generally, patients with developmental delay need to be stable without IM antipsychotics for > 3 months prior to LTC acceptance.' }
      ], 'beh_dd');
    } else if (cause === 'brain_injury') {
      addRec('recommended', 'Brain Injury — Rehabilitation Assessment', [
        { text: 'If new brain injury or active rehabilitation goals exist, consider submitting a Subacute Consult.', referral: 'Subacute Consult Team in Epic' },
        { text: 'Patient may be eligible for the Acquired Brain Injury/Behavioural Rehabilitation Service (ABI/BRS).' },
        { text: 'Once accepted to rehab, Transitional Care auto-accepts and patient is waitlisted for TOH TCU bed. Ensure patient/family are aware of possible transfer to Transitional Care Centre (1095 Carling Ave). Wait times are variable.', referral: 'TOH TCU Consult in Epic' }
      ], 'beh_brain_injury');
    } else if (cause === 'psychiatric') {
      addRec('recommended', 'Behavioural Management — Psychiatric Illness', [
        { text: 'MRP to consult Psychiatry for assessment and management recommendations.', referral: 'Psychiatry Consult in Epic' },
        { text: 'Behavioural stabilization on an appropriate medication regimen should be achieved prior to discharge when possible.' },
        { text: 'SW to coordinate with community mental health supports for follow-up.', referral: 'SW Consult in Epic' },
        { text: 'If behaviours are severe and patient lacks capacity, consider involuntary status under the Mental Health Act if criteria are met.' }
      ], 'beh_psych');
    } else {
      addRec('recommended', 'Behavioural Management — No Identified Clinical Cause', [
        { text: 'If patient is capable, consider a behavioural contract. Continued non-adherence may result in discharge from hospital.', referral: 'Behavioural Contract Template' },
        { text: 'Explore underlying causes (pain, delirium, fear, cultural factors) and address.' },
        { text: 'Ethics consult may be appropriate if behaviours create safety risk to staff or other patients.', referral: 'Ethics Consult' },
        { text: 'Refer to TOH Rights, Responsibilities, and Zero Tolerance Policy.', referral: 'TOH Zero Tolerance Policy' }
      ], 'beh_none');
    }
  }

  /* ---- PALLIATIVE CARE NEEDS ---- */
  if (barriers.palliative?.selected) {
    const prog = barriers.palliative.prognosis || patient.prognosis;
    const living = patient.livingEnv;

    if (living === 'ltc') {
      addRec('priority', 'Return to Home LTC — Palliative Pathway', [
        { text: 'Palliative care can be provided within the LTC setting. Patient has 31 days to return before losing their LTC bed. Ensure OHAH palliative nursing is arranged if LTC requires additional support.', referral: 'OHAH Referral (Palliative Nursing)' }
      ], 'pal_ltc');
      if (prog === 'days' || prog === 'weeks') {
        addRec('option', 'Hospice Discharge (if LTC cannot meet palliative needs)', [
          { text: 'SW to complete centralized application for all Ottawa hospice facilities. Prognosis must be < 3 months. Covered by OHIP. Patient/family encouraged to accept first bed offer.', referral: 'Hospice Application via SW' }
        ], 'pal_ltc_hospice');
        addRec('option', 'End of Life Care at TOH', [
          { text: 'If prognosis is very short (days) and transfer is not feasible, patient may remain. MRP to refer to TOH TCU. Ensure ALC status is discontinued.', referral: 'TOH TCU Consult in Epic' }
        ], 'pal_ltc_eol');
      }
    } else if (prog === 'days') {
      addRec('priority', 'End of Life Care at TOH', [
        { text: 'Patients with expected prognosis of short days may remain at TOH. MRP to refer to TOH TCU in Epic and notify patient/family of potential transfer. Ensure ALC status is discontinued.', referral: 'TOH TCU Consult in Epic' }
      ], 'pal_days_eol');
      addRec('recommended', 'Hospice Discharge', [
        { text: 'Centralized application for all Ottawa hospice facilities must be completed by Social Work. Prognosis must be < 3 months. Covered by OHIP. Patient/family may request preferred location but should accept first bed offer.', referral: 'Hospice Application via SW' }
      ], 'pal_days_hospice');
      addRec('option', 'Home with Palliative Home Care', [
        { text: 'CCL to consult OHAH, specifically requesting palliative care nursing.', referral: 'OHAH Referral (Palliative Nursing)' },
        { text: 'Consider referral to the Regional Palliative Care Team. Family physician must be contacted and will support the patient in the community.', referral: 'RPCT Referral Form' },
        { text: 'Consider referral to a community palliative care physician group that does home visits. Physician groups accept patients based on postal code. Requires physician referral.' }
      ], 'pal_days_home');
    } else if (prog === 'weeks') {
      addRec('priority', 'Home with Palliative Home Care', [
        { text: 'CCL to consult OHAH, specifically requesting palliative care nursing.', referral: 'OHAH Referral (Palliative Nursing)' },
        { text: 'YCAH may also be an option.', referral: 'YCAH Referral (SW)' },
        { text: 'Consider referral to the Regional Palliative Care Team.', referral: 'RPCT Referral Form' },
        { text: 'Consider referral to a community palliative care physician group for home visits. Requires physician referral.' }
      ], 'pal_weeks_home');
      addRec('recommended', 'Hospice Discharge', [
        { text: 'SW to complete centralized application. Prognosis must be < 3 months. Covered by OHIP. Encourage patient/family to accept first bed offer.', referral: 'Hospice Application via SW' }
      ], 'pal_weeks_hospice');
      if (living === 'retirement_home' || living === 'group_home') {
        addRec('option', 'Retirement Home with Palliative Home Care', [
          { text: 'If current home is not suitable for palliative care. Private funds required. CCL to consult OHAH.', referral: 'OHAH Referral (Palliative Nursing)' }
        ], 'pal_weeks_rh');
      }
    } else if (prog === 'months') {
      addRec('recommended', 'Home with Home Care ± Palliative Supports', [
        { text: 'CCL to consult OHAH. Palliative care nursing can be requested if appropriate.', referral: 'OHAH Referral' },
        { text: 'Consider referral to the Regional Palliative Care Team if prognosis approaches < 3 months.', referral: 'RPCT Referral Form' }
      ], 'pal_months_home');
      addRec('option', 'Hospice Discharge (if prognosis < 3 months)', [
        { text: 'If prognosis is estimated at < 3 months, SW to complete centralized hospice application. Covered by OHIP.', referral: 'Hospice Application via SW' }
      ], 'pal_months_hospice');
      addRec('option', 'Complex Continuing Care (SVH)', [
        { text: 'If patient has specific care needs difficult to meet in community (e.g., wound care, ventilator care). SVH units available: wound care, dialysis care, ventilator care.', referral: 'SVH Complex Continuing Care Referral' }
      ], 'pal_months_ccc');
    }
  }

  /* ---- SPECIALTY TREATMENT FROM OUT OF TOWN ---- */
  if (barriers.specialty?.selected) {
    const type = barriers.specialty.type;

    if (type === 'hyperbaric') {
      addRec('recommended', 'Hyperbaric Oxygen — Outpatient Management', [
        { text: 'Patient may require accommodation in Ottawa during the treatment course. SW to assist with arranging local accommodation (e.g., patient lodges, charity housing).', referral: 'SW Consult in Epic' },
        { text: 'If medically stable, patient should not remain inpatient for convenience of treatment access. Arrange outpatient treatment scheduling in coordination with the home hospital.' }
      ], 'spec_hyperbaric');
    } else if (type === 'bmt') {
      addRec('recommended', 'Bone Marrow Transplant — Discharge Coordination', [
        { text: 'Coordinate with transplant team regarding discharge readiness and required post-discharge proximity. If patient must remain near TOH post-discharge, SW to assist with temporary local accommodation.', referral: 'SW Consult in Epic' },
        { text: 'Repatriation to home hospital when transplant team clears for distance follow-up.', referral: 'Repatriation Order in Epic' }
      ], 'spec_bmt');
    } else if (type === 'cancer') {
      addRec('recommended', 'Cancer / Oncology Treatment — Discharge Planning', [
        { text: 'Coordinate with oncology team regarding treatment schedule and proximity requirements.' },
        { text: 'If ongoing daily/weekly treatments, SW to assist with local accommodation or patient lodge.', referral: 'SW Consult in Epic' },
        { text: 'If treatment is complete or can be delivered closer to home, MRP to arrange repatriation.', referral: 'Repatriation Order in Epic' }
      ], 'spec_cancer');
    } else if (type === 'dialysis') {
      addRec('recommended', 'Acute Dialysis — Transition Planning', [
        { text: 'Coordinate with nephrology regarding transition from acute to maintenance dialysis.' },
        { text: 'If patient can transition to outpatient dialysis near home, MRP to arrange repatriation and transfer of dialysis care.', referral: 'Repatriation Order in Epic' },
        { text: 'If must remain at TOH for specialized dialysis, patient should not remain inpatient. Arrange outpatient dialysis access and local accommodation.' }
      ], 'spec_dialysis');
    }
  }

  /* ---- AWAITING TEST / PROCEDURE ---- */
  if (barriers.awaitingTest?.selected) {
    addRec('priority', 'Awaiting Test/Procedure/Assessment — Convert to Outpatient', [
      { text: 'If the patient no longer requires day-to-day hospital care or medical surveillance and is considered stable for discharge, all upcoming tests and imaging should be ordered as OUTPATIENT investigations.' },
      { text: 'Pending medical assessments should be completed in the outpatient setting, with appropriate ambulatory orders placed at discharge. Clear communication to patient/family regarding upcoming appointments and whom to contact if not yet arranged.' },
      { text: 'Procedures that can be safely performed as outpatient and are not required to stabilize the patient for discharge should be triaged and scheduled by the responsible service, with the plan documented in the discharge summary.' }
    ], 'await_test');
  }

  /* ---- AWAITING MAID ---- */
  if (barriers.awaitingMAID?.selected) {
    addRec('recommended', 'MAID — Discharge While Awaiting Assessment or Procedure', [
      { text: 'Patients awaiting MAID may be discharged with clear information regarding next steps in the process. Patients who wish to receive MAID in hospital may access MAID facilities at the Civic Campus as an outpatient.', referral: 'MAID Resource Sheet' },
      { text: 'If a MAID date has been confirmed and is scheduled within 1–2 weeks, and if alternative discharge plans are not feasible, it may be reasonable for the patient to remain in hospital. Any team member can place a TCU consult in Epic.', referral: 'TOH TCU Consult in Epic' },
      { text: 'SW and Ethics consult may support patient and family through decision-making process.', referral: 'SW Consult in Epic' }
    ], 'await_maid');
  }

  /* ---- PATIENT UNHOUSED ---- */
  if (barriers.unhoused?.selected) {
    addRec('priority', 'Discharge to Shelter System — Medically Stable Unhoused Patient', [
      { text: 'Patients who are medically stable with no ongoing medical care needs cannot remain in hospital solely for food and shelter. If the patient is not at immediate risk of serious bodily harm upon discharge, they should be discharged to the shelter system. A taxi chit may be provided.', referral: 'Shelter Resources' },
      { text: 'Consider sending a referral to Ottawa Inner City Health (OICH) for follow-up and monitoring.', referral: 'OICH Referral Form' },
      { text: 'OHAH can provide select outpatient services within the shelter system (e.g., wound care). Indicate which shelter the patient plans to attend in the referral.', referral: 'OHAH Referral' }
    ], 'unhoused_stable');
    addRec('option', 'Inner City Health — Shelter-Based Programs', [
      { text: "Men's Special Care Unit — Salvation Army (171 George Street): 30 beds for complex health needs." },
      { text: 'Diane Morrison Hospice — Ottawa Mission (53 Daly Ave): 14 hospice beds + 7 chronic palliative beds (if palliative).' },
      { text: 'Ottawa Inner City Health Primary Care Clinic.' }
    ], 'unhoused_inner_city');
    addRec('option', 'SW Consult for Housing Supports', [
      { text: 'SW to connect patient with housing services, Ontario Works, ODSP, and community agencies for transitional or supportive housing.', referral: 'SW Consult in Epic' }
    ], 'unhoused_housing');
  }

  /* ---- COMORBIDITY-SPECIFIC CONSIDERATIONS (separate section) ---- */
  // These are collected into comorRecs, which is rendered as its own named section
  // in the output beneath the barrier recommendations.
  // Abuse is ALSO kept in recs (main Priority tier) because it is safety-critical
  // and must appear at the top of output regardless of section layout.
  // MAID is a patient pathway / barrier selection — it has no comorbidity checkbox
  // and is handled entirely by the awaitingMAID barrier block above.
  const comorbidities = patient.comorbidities || [];
  const comorRecs = [];
  const addComorRec = (key, label, tier, icon, items) => {
    comorRecs.push({ key, label, tier, icon, items });
  };

  if (comorbidities.includes('dialysis')) {
    addComorRec('dialysis', 'Dialysis', 'action', '', [
      { heading: 'Pre-Discharge Requirement', text: 'Outpatient dialysis must be arranged and confirmed BEFORE discharge. Coordinate with nephrology for community dialysis placement. Do not discharge without a confirmed dialysis schedule.' },
      { heading: 'SVH Complex Continuing Care', text: 'If community dialysis is not feasible, SVH Complex Continuing Care has a dedicated dialysis care unit. Any team member can refer.', referral: 'SVH Complex Continuing Care Referral' },
      { heading: 'Discharge Destination Alert', text: 'Active dialysis is a barrier to some rehabilitation programs and LTC homes. Confirm acceptance explicitly with the receiving facility before submitting a referral. Do not assume eligibility.' },
    ]);
  }
  if (comorbidities.includes('vac_wounds')) {
    addComorRec('vac_wounds', 'Wounds Requiring VAC', 'action', '', [
      { heading: 'Community Wound Care', text: 'OHAH can manage some wound care in the community. CCL to confirm with the OHAH wound care team that the specific wound type and VAC requirements are within community scope before discharge.', referral: 'OHAH Referral (Wound Care)' },
      { heading: 'SVH Complex Continuing Care', text: 'SVH has a specialized wound care unit for patients whose wound needs exceed community capacity.', referral: 'SVH Complex Continuing Care Referral' },
      { heading: 'LTC Confirmation Required', text: 'VAC management is a barrier to standard LTC. Confirm explicitly that the LTC home has VAC capacity before referral — do not assume.' },
      { heading: 'Step-Down Planning', text: 'If VAC use is transitional, anticipate and plan the step-down to standard wound care. Earlier transition expands discharge destination options significantly.' },
    ]);
  }
  if (comorbidities.includes('trach_independent')) {
    addComorRec('trach_independent', 'Tracheostomy — Independent for Care', 'note', '', [
      { heading: 'Not a Discharge Barrier', text: 'Patient manages tracheostomy care independently. This comorbidity should NOT delay discharge. Ensure patient has an adequate supply of trach care equipment arranged for the discharge destination.' },
      { heading: 'OHAH Support', text: 'OHAH can provide supplementary support as needed post-discharge.', referral: 'OHAH Referral' },
      { heading: 'Destination Availability', text: 'Most discharge destinations — home, retirement home, LTC, rehab — remain available for patients independent with trach care.' },
    ]);
  }
  if (comorbidities.includes('trach_dependent')) {
    addComorRec('trach_dependent', 'Tracheostomy — Dependent / Suction / Humidifier Required', 'action', '', [
      { heading: 'SVH Complex Continuing Care — Ventilator Unit', text: 'SVH Complex Continuing Care has a ventilator care unit for patients requiring ongoing respiratory support including active trach management.', referral: 'SVH Complex Continuing Care Referral' },
      { heading: 'Home with Home Care', text: 'Home discharge is possible ONLY if a trained caregiver is available 24/7 AND OHAH respiratory nursing is confirmed and in place prior to discharge. Both conditions must be met simultaneously.', referral: 'OHAH Referral (Respiratory Nursing)' },
      { heading: 'LTC Confirmation Required', text: 'Most LTC homes cannot manage active tracheostomy care. Do not refer to LTC without explicit written confirmation from the receiving facility that they can meet active trach needs.' },
    ]);
  }
  if (comorbidities.includes('new_stroke')) {
    addComorRec('new_stroke', 'New Stroke', 'action', '', [
      { heading: 'Subacute Rehabilitation Referral', text: 'Submit a Subacute Consult for consideration of Stroke Rehabilitation at Bruyère. This should be initiated as soon as the patient is medically stable.', referral: 'Subacute Consult Team in Epic' },
      { heading: 'If Declined from Rehab', text: 'If the patient is declined from the stroke rehab program, return to this tool and complete with Mobility/Functional Impairment: NOT likely to improve to generate the appropriate discharge pathway.' },
      { heading: 'Outpatient Follow-Up', text: 'Ensure outpatient stroke clinic follow-up is arranged and confirmed at discharge. Document clinic name, contact, and expected appointment timing in the discharge summary.' },
    ]);
  }
  if (comorbidities.includes('sci')) {
    addComorRec('sci', 'Spinal Cord Injury', 'action', '', [
      { heading: 'Neurospinal Rehabilitation', text: 'Submit a Subacute Consult for Neurospinal Rehabilitation. This is the primary discharge pathway for patients with SCI and rehabilitation potential.', referral: 'Subacute Consult Team in Epic' },
      { heading: 'Physiatry Consult', text: 'Consider physiatry consult for development of a long-term functional management plan, regardless of whether inpatient rehab is pursued.', referral: 'Physiatry Consult in Epic' },
      { heading: 'Home Modifications', text: 'Home modifications will almost certainly be required. OT assessment for home safety should be initiated early to allow time for modifications to be arranged prior to discharge.', referral: 'OT Consult in Epic' },
      { heading: 'If Rehab Not Appropriate', text: 'If the patient is not a candidate for inpatient rehabilitation, manage as high care needs with Mobility/Functional Impairment NOT likely to improve. Return to this tool and re-complete with those selections.' },
    ]);
  }
  if (comorbidities.includes('metastatic_cancer')) {
    addComorRec('metastatic_cancer', 'Metastatic Cancer', 'action', '', [
      { heading: 'Establish Prognosis First', text: 'Before completing discharge planning, establish current prognosis with the oncology team and reassess the discharge plan accordingly. Prognosis drives the entire downstream pathway.' },
      { heading: 'Hospice Referral (Prognosis < 3 Months)', text: 'If prognosis is estimated at less than 3 months, a hospice referral is appropriate. SW to complete the centralized application. Covered by OHIP.', referral: 'Hospice Application via SW' },
      { heading: 'Community Palliative Care Team', text: 'Consider referral to the Regional Palliative Care Team for symptom management and support in the community setting. Family physician must be contacted to coordinate.', referral: 'RPCT Referral Form' },
      { heading: 'Active Treatment Coordination', text: 'If active cancer treatment is ongoing, coordinate the outpatient oncology treatment plan with the oncology team prior to discharge. Confirm the patient has transportation and appointment arrangements in place.' },
    ]);
  }
  if (comorbidities.includes('high_oxygen')) {
    addComorRec('high_oxygen', 'High Oxygen Requirement', 'action', '', [
      { heading: 'Pre-Discharge Requirement', text: 'Home oxygen equipment must be assessed, ordered, and arranged BEFORE discharge. Respiratory therapy to assess needs and place equipment order. Confirm the home environment can safely and physically accommodate oxygen equipment.' },
      { heading: 'Destination Confirmation', text: 'Some retirement homes and LTC homes have oxygen flow rate capacity limits. Confirm the specific oxygen requirement against the facility\'s capacity before referral.' },
      { heading: 'SVH Complex Continuing Care', text: 'If oxygen requirements exceed what can be safely managed in community or standard LTC, SVH Complex Continuing Care can accommodate higher-level respiratory needs.', referral: 'SVH Complex Continuing Care Referral' },
    ]);
  }
  if (comorbidities.includes('tube_feeds_independent')) {
    addComorRec('tube_feeds_independent', 'Tube Feeds — Independent', 'note', '', [
      { heading: 'Not a Discharge Barrier', text: 'Patient manages tube feeding independently. This should NOT delay discharge.' },
      { heading: 'Supply Chain', text: 'Ensure the supply chain for formula, feeding sets, and equipment is arranged and confirmed for the discharge destination prior to discharge.' },
      { heading: 'Dietitian Sign-Off', text: 'Dietitian to review and confirm the discharge nutrition plan including formula type, rate, schedule, and community follow-up.' },
    ]);
  }
  if (comorbidities.includes('tube_feeds_dependent')) {
    addComorRec('tube_feeds_dependent', 'Tube Feeds — Dependent', 'action', '', [
      { heading: 'Caregiver Training Required', text: 'A trained caregiver must be identified, trained, and confirmed competent BEFORE discharge. Discharge should not proceed until training is complete and documented.' },
      { heading: 'OHAH Nursing Support', text: 'OHAH may provide nursing support for tube feeding administration in the community. Confirm scope and frequency with OHAH before discharge.', referral: 'OHAH Referral' },
      { heading: 'LTC Capacity', text: 'Confirm that the receiving LTC home can manage tube feeds before submitting the referral — not all LTC homes have the nursing capacity for dependent tube feeding.' },
      { heading: 'SVH Complex Continuing Care', text: 'If community supports or LTC cannot meet tube feeding needs, SVH Complex Continuing Care is the appropriate destination.', referral: 'SVH Complex Continuing Care Referral' },
    ]);
  }
  if (comorbidities.includes('chf_copd')) {
    addComorRec('chf_copd', 'End-Stage CHF / End-Stage COPD', 'action', '', [
      { heading: 'Establish Prognosis', text: 'Establish prognosis with the MRP. If prognosis is estimated at less than 3 months, the palliative pathway applies — refer to hospice, palliative home care, and/or RPCT.', referral: 'RPCT Referral Form' },
      { heading: 'Symptom Optimization', text: 'Optimize symptom management (dyspnea, fluid management, pain) prior to discharge. Ensure all medications are reconciled and the community team has a clear management plan.' },
      { heading: 'Community Follow-Up', text: 'Ensure confirmed follow-up with cardiology and/or respirology, and/or palliative care depending on trajectory. Document contact information and appointment timing in the discharge summary.' },
      { heading: 'Preferred Discharge Destination', text: 'Home with home care ± palliative nursing is the preferred pathway if feasible and aligned with patient goals.', referral: 'OHAH Referral (Palliative Nursing)' },
    ]);
  }
  if (comorbidities.includes('managed_alcohol')) {
    addComorRec('managed_alcohol', 'Managed Alcohol Program (MAP)', 'action', '', [
      { heading: 'MAP Limits Discharge Destinations', text: 'An active Managed Alcohol Program significantly restricts discharge destinations. MAP is a barrier to most rehabilitation programs, LTC facilities, and convalescent care. This must be addressed and resolved before a transfer can be arranged.' },
      { heading: 'Community MAP Transition', text: 'Coordinate with the Substance Use team for a transition plan to a community-based MAP or an appropriate alternative.', referral: 'Substance Use Program Consult in Epic' },
      { heading: 'The Oakes — Supportive Housing with MAP', text: 'The Oakes is a supportive facility for patients who would benefit from additional support and do not wish to abstain from alcohol. Patients cannot await placement in hospital unless all other options would place them at immediate risk of serious bodily harm. Patient can await placement from the shelter system or current housing. Complete the Oakes referral early.', referral: 'Oakes Referral Form' },
      { heading: 'Inner City Health Programs', text: 'Inner City Health programs (Men\'s Special Care Unit, Diane Morrison Hospice if palliative) may also accommodate patients on MAP.' },
    ]);
  }
  if (comorbidities.includes('non_weight_bearing')) {
    addComorRec('non_weight_bearing', 'Non-Weight Bearing Status', 'note', '', [
      { heading: 'Typically Temporary', text: 'Establish the expected duration and weight-bearing timeline with orthopedics and/or the MRP. Communicate this timeline clearly to the patient, family, and receiving facility.' },
      { heading: 'Bridging Options', text: 'If temporary, convalescent care or short-term inpatient rehabilitation may be appropriate to bridge the period until weight-bearing is restored.' },
      { heading: 'Rehabilitation Goals', text: 'If rehabilitation goals exist, submit a Subacute Consult. Non-weight bearing status does not automatically preclude rehab, but the rehab program must be aware and confirm acceptance.', referral: 'Subacute Consult Team in Epic' },
      { heading: 'If Permanent', text: 'If non-weight bearing is expected to be permanent or long-term, manage as mobility/functional impairment NOT likely to improve. Return to this tool and complete with those selections.' },
    ]);
  }
  if (comorbidities.includes('dementia')) {
    addComorRec('dementia', 'MCI / Dementia', 'note', '', [
      { heading: 'Capacity Assessment', text: 'If cognitive impairment may affect the patient\'s ability to make or communicate a discharge decision, a formal capacity assessment for the specific discharge decision should be completed by the MRP.', referral: 'Capacity Assessment Resource' },
      { heading: 'Behavioural Support', text: 'If reactive behaviours are present, Geriatric Psychiatry and the Dementia Behavioural Support Team (DBST) referrals are available for in-hospital management support.', referral: 'Geriatric Psychiatry Consult in Epic' },
      { heading: 'GOAT and Dementia Coach', text: 'GOAT (Geriatric Outreach Assessment Team) referral and Dementia Coach referral are available to support the transition to community.', referral: 'GOAT Referral / Dementia Coach' },
    ]);
  }
  if (comorbidities.includes('abuse')) {
    // Abuse: ALSO added to main recs as Priority (safety-critical — must appear at top)
    addRec('priority', ' Suspected or Confirmed Abuse — Immediate Action Required', [
      { text: 'SW consult required IMMEDIATELY. A safety assessment must be completed before ANY discharge planning proceeds.', referral: 'SW Consult in Epic (Urgent)' },
      { text: 'Do NOT discharge the patient to the environment where abuse is occurring without a safety plan confirmed and documented.' },
      { text: 'SW to connect with community resources: shelters, victim services, police involvement as appropriate.' },
      { text: 'If patient lacks capacity, SDM assessment and potential Public Guardian and Trustee (PG&T) involvement is required.' }
    ], 'comor_abuse_main');
    // Also surfaces in the comorbidity section with full detail
    addComorRec('abuse', 'Suspected or Confirmed Abuse', 'urgent', '', [
      { heading: 'Immediate SW Consult Required', text: 'Social Work must be consulted immediately. A safety assessment is mandatory and must be completed BEFORE any discharge planning is initiated or advanced.', referral: 'SW Consult in Epic (Urgent)' },
      { heading: 'Discharge Destination Safety Rule', text: 'Do NOT discharge the patient to the environment where abuse is occurring — or to any environment where abuse may continue — without a confirmed and documented safety plan in place.' },
      { heading: 'Community Safety Resources', text: 'SW to connect the patient with community resources as appropriate: domestic violence shelters, sexual assault support centres, victim services, and police involvement where indicated.' },
      { heading: 'Incapable Patient Protocol', text: 'If the patient lacks capacity to make decisions about their own safety, an SDM assessment must be completed. If no appropriate SDM is available, PG&T involvement may be required.' },
    ]);
  }
  if (comorbidities.includes('oat')) {
    addComorRec('oat', 'Methadone / Opioid Agonist Therapy (OAT)', 'action', '', [
      { heading: 'Pre-Discharge OAT Arrangement', text: 'Confirm that the patient\'s OAT (methadone, buprenorphine/naloxone, or other) prescription is transferred to a community pharmacy before discharge. Do not discharge without a confirmed dispensing arrangement.' },
      { heading: 'Substance Use Program', text: 'MRP to consider referral to the Substance Use Program for management recommendations and discharge planning support.', referral: 'Substance Use Program Consult in Epic' },
      { heading: 'Destination Considerations', text: 'Most discharge destinations can accommodate patients on OAT. Confirm with receiving facility if OAT administration support is required (e.g., witnessed dosing at LTC or retirement home).' },
    ]);
  }
  if (comorbidities.includes('active_su')) {
    addComorRec('active_su', 'Active Substance Use', 'action', '', [
      { heading: 'Behavioural Contract', text: 'Consider a behavioural contract for capable patients whose substance use is interfering with care or discharge planning. Continued non-adherence to the contract may result in discharge from hospital.', referral: 'Behavioural Contract Template' },
      { heading: 'Substance Use Consult', text: 'MRP to consider referral to the Substance Use Program for management recommendations.', referral: 'Substance Use Program Consult in Epic' },
      { heading: 'TOH Policies', text: 'Review and apply relevant TOH substance use policies during the admission.', referral: 'TOH Alcohol / Cannabis / Smoking Policies' },
      { heading: 'Discharge Destination', text: 'Active substance use is generally not a barrier to discharge to home, shelter, or community settings. It may be a barrier to rehabilitation programs and some LTC facilities — confirm with the receiving program.' },
    ]);
  }

  /* ---- GERIATRIC RESOURCES (age ≥ 65) ---- */
  const geriatricResources = patient.age === '>=65' ? [
    'Adult Day Programs',
    'Geriatric Assessment Outpatient Clinic (GAOC)',
    'OHAH Geriatric Services (enhanced supports for older adults)',
    'If cognitive concerns: Geriatric Psychiatry Consult or Memory Clinic Referral',
    'Why Your Loved One May Not Be a Candidate for Inpatient Rehabilitation (patient resource)',
  ] : [];

  /* ---- TALKING POINTS ---- */
  const talkingPoints = [];
  talkingPoints.push({ text: 'Serious Illness Conversation Guide', referral: 'Serious Illness Conversation Guide' });

  if (patient.prognosis === 'days' || patient.prognosis === 'weeks' || patient.prognosis === 'months' ||
      barriers.palliative?.selected || comorbidities.includes('metastatic_cancer') || comorbidities.includes('chf_copd')) {
    talkingPoints.push({ text: 'Cancer / Serious Illness Trajectory Graph for patient and family discussions', referral: 'Cancer Trajectory Graph' });
  }

  if (barriers.mobility?.likelyImprove === 'no' || barriers.mobility?.likelyImprove === 'unknown') {
    talkingPoints.push({ text: 'Why Your Loved One Is Not a Candidate for Inpatient Rehabilitation', referral: 'Inpatient Rehab Eligibility Resource' });
    talkingPoints.push({ text: 'Outpatient Rehabilitation Resources (OHIP-covered PT clinics, OHAH PT/OT referrals)', referral: 'Outpatient Rehab Resource' });
  }

  if (patient.livingEnv === 'shelter' || barriers.unhoused?.selected) {
    talkingPoints.push({ text: 'Shelter Resources and Inner City Health Ottawa', referral: 'Shelter Resources' });
    talkingPoints.push({ text: 'Ethics Resources — Discharge to Shelter', referral: 'Ethics Resources' });
    talkingPoints.push({ text: 'Counselling guidance: Discharge at Risk', referral: 'Discharge at Risk Resource' });
  }

  if (comorbidities.includes('managed_alcohol') || barriers.behaviours?.cause === 'substance') {
    talkingPoints.push({ text: 'TOH Alcohol Policy and Managed Alcohol Program Guidance', referral: 'TOH Alcohol Policy' });
  }

  talkingPoints.push({ text: 'TOH Discharge Policy — 48-Hour Decision Rule & Co-Payment', referral: 'TOH Discharge Policy' });
  talkingPoints.push({ text: 'LTC Application Process', referral: 'LTC Application Resource' });
  talkingPoints.push({ text: 'Retirement Home Finding Services (Tea and Toast and others)', referral: 'Tea and Toast Referral' });

  if (comorbidities.includes('dementia') || patient.age === '>=65') {
    talkingPoints.push({ text: 'Dementia Resources — DBST, Dementia Coach', referral: 'Dementia Coach Referral' });
  }

  return {
    recs,
    comorRecs,
    falseBarriers,
    geriatricResources,
    talkingPoints,
    contextItems,
    hasAnyBarrier: barriers.mobility?.selected || barriers.livingEnv?.selected || barriers.careNeeds?.selected ||
      barriers.disagreement?.selected || barriers.behaviours?.selected || barriers.palliative?.selected ||
      barriers.specialty?.selected || barriers.awaitingTest?.selected || barriers.awaitingMAID?.selected ||
      barriers.unhoused?.selected,
  };
}

/* Helper to add NOT-improve mobility recommendations */
function generateNotImproveMobility(patient, recs, prog, living, keyPrefix) {
  // ── SHELTER PATHWAY: overrides generic logic for all prognosis brackets ──────
  // Source: Part 4 table rows for living=shelter × mobility NOT improve/unknown
  if (living === 'shelter') {
    if (prog === 'days') {
      // Shelter + days: hospice-first, then Inner City palliative, then TOH EOL

    } else if (prog === 'weeks' || prog === 'months') {
      // Shelter + weeks/months: Inner City Health programs first, then CCC, then LTC
      // Source: Part 4 "NOT improve, unknown + Shelter/unhoused + Prognosis weeks, months"
      recs.push({ tier: 'priority', title: 'Inner City Health — Shelter-Based Programs', key: keyPrefix+'_s_inner_wm', items: [

      recs.push({ tier: 'recommended', title: 'Inner City Health — Shelter-Based Programs', key: keyPrefix+'_shelter_inner', items: [
        { text: "Men's Special Care Unit (Salvation Army, 171 George Street): 30 beds for complex health needs." },

      ]});
    }
    return; // ← shelter pathway fully handled; do not fall through to generic logic
  }

  // ── GENERIC (non-shelter) PATHWAYS ───────────────────────────────────────────
  if (prog === 'days' || prog === 'weeks') {
    recs.push({ tier: 'priority', title: 'Home with Palliative Home Care', key: keyPrefix+'_home', items: [

    recs.push({ tier: 'option', title: 'Long-Term Care (Last Resort)', key: keyPrefix+'_ltc_months', items: [

  } else {
    // years — non-shelter
    if (living === 'shelter') {

        { text: "Men's Special Care Unit (Salvation Army, 171 George Street): 30 beds for complex health needs." },

      recs.push({ tier: 'option', title: 'Complex Continuing Care (SVH)', key: keyPrefix+'_shelter_ccc', items: [
        { text: 'For patients with specific care needs difficult to meet in community or LTC. SVH units: wound care, dialysis care, ventilator care.', referral: 'SVH Complex Continuing Care Referral' },

function livingEnvLabel(val) {
  const map = { accessible_home: 'Accessible Home', inaccessible_home: 'Inaccessible Home',
    retirement_home: 'Retirement Home', group_home: 'Group Home', shelter: 'Shelter/Unhoused', ltc: 'Long-Term Care' };
  return map[val] || val;
}
function insuranceLabel(val) {
  const map = { ohip: 'OHIP', ramq: 'RAMQ (Quebec)', ifh: 'Interim Federal Health', private: 'Private Coverage', uninsured: 'Uninsured' };
  return map[val] || val;
}
function locationLabel(val) {
  const map = { ottawa: 'Ottawa', out_of_town: 'Out-of-Town / Alternative Jurisdiction', out_of_province: 'Out-of-Province / Out-of-Country' };
  return map[val] || val;
}
function prognosisLabel(val) {
  const map = { days: 'Days', weeks: 'Weeks', months: 'Months', years: 'Years' };
  return map[val] || val;
}
function barrierNames(barriers) {
  const names = [];
  if (barriers.mobility?.selected) names.push('Mobility/Functional Impairment');
  if (barriers.livingEnv?.selected) names.push('Unsuitable Living Environment');
  if (barriers.careNeeds?.selected) names.push('Increased Care Needs');
  if (barriers.disagreement?.selected) names.push('Disagreement/Delay of Discharge');
  if (barriers.behaviours?.selected) names.push('Patient Behaviours');
  if (barriers.palliative?.selected) names.push('Palliative Care Needs');
  if (barriers.specialty?.selected) names.push('Specialty Treatment from Out of Town');
  if (barriers.awaitingTest?.selected) names.push('Awaiting Test/Procedure/Assessment');
  if (barriers.awaitingMAID?.selected) names.push('Awaiting MAID');
  if (barriers.unhoused?.selected) names.push('Patient Unhoused');
  return names;
}

function RecBlock({ rec }) {

        <span className="rec-block-title">{rec.title}</span>
      </div>
      <div className="rec-block-body">
        {rec.items.map((item, i) => (
          <div key={i} className="rec-item">
            <div className="rec-item-text">{item.text}</div>
            {item.referral && (
              <div style={{ marginTop: 6 }}>
                <ResourceLink label={item.referral} />
              </div>
            )}
          </div>

function RadioGroup({ value, onChange, options }) {
  return (
    <div className="radio-group">
      {options.map(opt => (
        <label key={opt.value} className={`radio-btn ${value === opt.value ? 'selected' : ''}`} onClick={() => onChange(opt.value)}>
          <span className="radio-dot"></span>
          {opt.label}
        </label>
      ))}
    </div>
  );
}

function CheckGroup({ values = [], onChange, options, className = 'checkbox-group' }) {
  const toggle = (v) => {
    if (values.includes(v)) onChange(values.filter(x => x !== v));
    else onChange([...values, v]);
  };
  return (
    <div className={className}>
      {options.map(opt => (
        <label key={opt.value} className={`check-btn ${values.includes(opt.value) ? 'selected' : ''}`} onClick={() => toggle(opt.value)}>
          <span className="check-box-icon">{values.includes(opt.value) ? '' : ''}</span>
          {opt.label}
        </label>
      ))}
    </div>
  );
}

/* ================================================================

function BarrierCard({ title, icon, isSelected, isFalseBarrier, onToggle, children }) {
  return (
    <div className={`barrier-card ${isSelected ? 'selected' : ''} ${isFalseBarrier ? 'false-barrier' : ''}`}>
      <div className="barrier-header" onClick={onToggle}>
        <span className={`barrier-check ${isSelected ? 'checked' : ''}`}></span>
        <span className="barrier-title">{icon} {title}</span>
        {isSelected && <span className="barrier-expand-icon open"></span>}
      </div>
      {isSelected && <div className="barrier-body">{children}</div>}
    </div>
  );
}

function Step2({ barriers, setBarriers, patient, onBack, onNext }) {
  const update = (key, patch) => setBarriers(b => ({ ...b, [key]: { ...b[key], ...patch } }));
  const toggle = (key) => setBarriers(b => ({ ...b, [key]: { ...b[key], selected: !b[key]?.selected } }));

  return (
    <div>
      <div style={{ background:'#f0f5fb', border:'1px solid #c0d0e6', borderRadius:6, padding:'12px 16px', marginBottom:20, fontSize:'0.85rem', color:'#295d90' }}>
        <strong>Instructions:</strong> Check all real or anticipated discharge barriers. When selected, each category will expand to reveal sub-questions. Complete all sub-questions for each selected barrier before proceeding.
      </div>

      {/* MOBILITY */}
      <BarrierCard title="Mobility and/or Functional Impairment" icon="" isSelected={barriers.mobility?.selected} onToggle={() => toggle('mobility')}>

            { value: 'unknown', label: "Don't Know — discuss with PT/OT" },

      </BarrierCard>
