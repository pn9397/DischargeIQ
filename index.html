      <BarrierCard title="Living Environment Unsuitable" icon="" isSelected={barriers.livingEnv?.selected} onToggle={() => toggle('livingEnv')}>
        <div className="field-group">
          <div className="field-label">What makes the living environment unsuitable? (select all that apply)</div>
          <CheckGroup values={barriers.livingEnv?.subtypes || []} onChange={v => update('livingEnv', { subtypes: v })} options={[
            { value: 'alone', label: 'Living Alone' },
            { value: 'stairs', label: 'Stairs / Inaccessible Home' },
            { value: 'accessibility', label: 'General House Accessibility Issues' },
            { value: 'hoarding', label: 'Hoarding / Uncleanliness (Pest Control) ' },
            { value: 'high_care', label: 'High Care Needs — Cannot Manage in Current Setting' },
          ]} />
          {(barriers.livingEnv?.subtypes || []).includes('hoarding') && (
            <div className="false-barrier-notice" style={{marginTop:10}}>
              <span></span><span><strong>Potential False Barrier:</strong> Hoarding/uncleanliness alone should not delay discharge. See recommendations in Step 3.</span>
            </div>
          )}
        </div>
        <div className="field-group">
          <div className="field-label">Is this living environment barrier:</div>
          <RadioGroup value={barriers.livingEnv?.temporary} onChange={v => update('livingEnv', { temporary: v })} options={[
            { value: 'yes', label: 'Temporary — anticipated to improve with time' },
            { value: 'no', label: 'Permanent' },
          ]} />
        </div>
      </BarrierCard>

      {/* PALLIATIVE */}
      <BarrierCard title="Palliative Care Needs" icon="" isSelected={barriers.palliative?.selected} onToggle={() => toggle('palliative')}>
        <div className="field-group">
          <div className="field-label">Estimated Prognosis</div>
          <RadioGroup value={barriers.palliative?.prognosis} onChange={v => update('palliative', { prognosis: v })} options={[
            { value: 'days', label: 'Days' },
            { value: 'weeks', label: 'Weeks' },
            { value: 'months', label: 'Months' },
            { value: 'years', label: 'Years' },
          ]} />
        </div>
      </BarrierCard>

      {/* DISAGREEMENT */}
      <BarrierCard title="Disagreement or Delay of Discharge Planning" icon="" isSelected={barriers.disagreement?.selected} onToggle={() => toggle('disagreement')}>
        <div className="field-group">
          <div className="field-label">Does the patient have capacity to make the discharge decision?</div>
          <RadioGroup value={barriers.disagreement?.hasCapacity} onChange={v => update('disagreement', { hasCapacity: v, sdmAgrees: undefined })} options={[
            { value: 'yes', label: 'Yes — patient has capacity' },
            { value: 'no', label: 'No — patient lacks capacity' },
            { value: 'unknown', label: "Unknown — capacity not yet assessed" },
          ]} />
        </div>

        {/* CAPACITY = YES: patient is the decision-maker */}
        {barriers.disagreement?.hasCapacity === 'yes' && (
          <div className="field-group">
            <div className="field-label">Is the patient in agreement with the proposed discharge plan?</div>
            <RadioGroup value={barriers.disagreement?.sdmAgrees} onChange={v => update('disagreement', { sdmAgrees: v })} options={[
              { value: 'yes', label: 'Yes — patient agrees' },
              { value: 'no', label: 'No — patient refuses all discharge options and wishes to remain in hospital' },
            ]} />
            {barriers.disagreement?.sdmAgrees === 'yes' && (
              <div className="false-barrier-notice" style={{marginTop:8}}>
                <span></span>
                <span>If the patient (who has capacity) agrees, peripheral opinions of non-SDM family members are <strong>not</strong> a barrier to discharge. Proceed with the patient's plan.</span>
              </div>
            )}
            {barriers.disagreement?.sdmAgrees === 'no' && (
              <div className="false-barrier-notice" style={{marginTop:8, background:'#fdf3f2', borderLeft:'3px solid #c0392b'}}>
                <span></span>
                <span>This triggers the <strong>TOH Discharge Policy escalation pathway</strong>: documentation, 48-hour notification, unit director escalation, and possible daily co-payment. See Step 3 for the full protocol.</span>
              </div>
            )}
          </div>
        )}

        {/* CAPACITY = NO: SDM is the decision-maker */}
        {barriers.disagreement?.hasCapacity === 'no' && (
          <div className="field-group">
            <div className="field-label">What is the status of the Substitute Decision Maker (SDM)?</div>
            <RadioGroup value={barriers.disagreement?.sdmAgrees} onChange={v => update('disagreement', { sdmAgrees: v })} options={[
              { value: 'yes', label: 'SDM is identified and agrees with the discharge plan' },
              { value: 'no', label: 'SDM is identified but disagrees with the discharge plan' },
              { value: 'no_sdm', label: 'No SDM has been identified or SDM is unavailable' },
            ]} />
            {barriers.disagreement?.sdmAgrees === 'no' && (
              <div className="false-barrier-notice" style={{marginTop:8}}>
                <span></span>
                <span>SDM disagreement may require <strong>Consent and Capacity Board referral</strong> if the SDM is not acting in the patient's best interest. See Step 3.</span>
              </div>
            )}
            {barriers.disagreement?.sdmAgrees === 'no_sdm' && (
              <div className="false-barrier-notice" style={{marginTop:8, background:'#fdf3f2', borderLeft:'3px solid #c0392b'}}>
                <span></span>
                <span>No SDM available: <strong>SW consult required urgently</strong> to initiate Public Guardian and Trustee (PG&T) involvement. Do not pause discharge planning while awaiting PG&T — begin preparing discharge options now.</span>
              </div>
            )}
          </div>
        )}

        {/* CAPACITY = UNKNOWN */}
        {barriers.disagreement?.hasCapacity === 'unknown' && (
          <div className="info-note" style={{marginTop:4}}>
            A formal capacity assessment must be completed by the MRP before discharge planning can meaningfully advance. Capacity is decision-specific and time-specific. See Step 3 for the assessment protocol.
          </div>
        )}
      </BarrierCard>

      {/* BEHAVIOURS */}
      <BarrierCard title="Patient Behaviours" icon="" isSelected={barriers.behaviours?.selected} onToggle={() => toggle('behaviours')}>
        <div className="field-group">
          <div className="field-label">Are the behaviours due to:</div>
          <RadioGroup value={barriers.behaviours?.cause} onChange={v => update('behaviours', { cause: v })} options={[
            { value: 'cognitive', label: 'Cognitive Impairment / Dementia' },
            { value: 'substance', label: 'Active Substance Use Disorder' },
            { value: 'psychiatric', label: 'Psychiatric Illness' },
            { value: 'dd', label: 'Developmental Delay' },
            { value: 'brain_injury', label: 'Brain Injury' },
            { value: 'none', label: 'None of the Above' },
          ]} />
        </div>
      </BarrierCard>

      {/* SPECIALTY TREATMENT */}
      <BarrierCard title="Specialty Treatment from Out of Town" icon="" isSelected={barriers.specialty?.selected} onToggle={() => toggle('specialty')}>
        <div className="field-group">
          <div className="field-label">Treatment type:</div>
          <RadioGroup value={barriers.specialty?.type} onChange={v => update('specialty', { type: v })} options={[
            { value: 'hyperbaric', label: 'Hyperbaric Oxygen' },
            { value: 'bmt', label: 'Bone Marrow Transplant' },
            { value: 'cancer', label: 'Cancer (Medical or Radiation Oncology)' },
            { value: 'dialysis', label: 'Acute Dialysis' },
          ]} />
        </div>
      </BarrierCard>

      {/* AWAITING TEST */}
      <BarrierCard title="Awaiting Test, Imaging, Procedure, Assessment, or Appointment" icon="" isSelected={barriers.awaitingTest?.selected} onToggle={() => toggle('awaitingTest')}>
        <div className="false-barrier-notice">If the patient is medically stable and no longer requires day-to-day hospital care, tests and assessments should be ordered as outpatient. See recommendations in Step 3.</div>
      </BarrierCard>

      {/* AWAITING MAID */}
      <BarrierCard title="Awaiting MAID Assessment or Procedure" icon="" isSelected={barriers.awaitingMAID?.selected} onToggle={() => toggle('awaitingMAID')}>
        <div className="false-barrier-notice">Patients awaiting MAID may be discharged. MAID can be accessed at the Civic Campus as an outpatient. See detailed recommendations in Step 3.</div>
      </BarrierCard>

      {/* UNHOUSED */}
      <BarrierCard title="Patient Unhoused (Street, Shelter, or Living with Contacts)" icon="" isSelected={barriers.unhoused?.selected} onToggle={() => toggle('unhoused')}>
        <div className="false-barrier-notice">Patients who are medically stable and have no ongoing medical care needs cannot remain in hospital solely for food and shelter. See discharge recommendations in Step 3.</div>
      </BarrierCard>

      {/* INCREASED CARE NEEDS */}
      <BarrierCard title="Increased Care Needs (Other Than Mobility)" icon="" isSelected={barriers.careNeeds?.selected} onToggle={() => toggle('careNeeds')}>
        <div className="field-group">
          <div className="field-label">Primary care needs family/friends CANNOT provide (select all that apply):</div>
          <CheckGroup values={barriers.careNeeds?.types || []} onChange={v => update('careNeeds', { types: v })} options={[
            { value: 'housekeeping', label: 'Housekeeping / Deep Cleaning / Pest Control ' },
            { value: 'adl_dressing', label: 'ADL — Dressing' },
            { value: 'adl_bathing', label: 'ADL — Bathing' },
            { value: 'adl_toileting_feeding', label: 'ADL — Toileting / Feeding' },
            { value: 'adl_meds', label: 'Medication Administration' },
            { value: 'adl_supervision', label: 'Supervision / Wayfinding' },
            { value: 'adl_grocery', label: 'Grocery Shopping / Meal Prep' },
            { value: 'transport_appt', label: 'Transportation to Appointments ' },
            { value: 'iadl', label: 'Other iADL Assistance — requires PG&T involvement' },
          ]} />
          {(barriers.careNeeds?.types || []).includes('housekeeping') && (
            <div className="false-barrier-notice" style={{marginTop:10}}>
              <span></span><span><strong>Potential False Barrier:</strong> Housekeeping/pest control alone should not delay discharge.</span>
            </div>
          )}
          {(barriers.careNeeds?.types || []).includes('transport_appt') && (
            <div className="false-barrier-notice" style={{marginTop:6}}>
              <span></span><span><strong>Note:</strong> The hospital is NOT required to arrange transport home or to post-discharge appointments.</span>
            </div>
          )}
        </div>
      </BarrierCard>

      <div className="step-actions">
        <button className="btn-secondary" onClick={onBack}>← Back to Patient Profile</button>
        <button className="btn-primary" onClick={onNext}>
          Generate Expert Recommendations →
        </button>
      </div>
    </div>
  );
}

function ComorCard({ rec }) {
  const headerClass = `comor-card-header type-${rec.tier}`;
  return (
    <div className="comor-card">
      <div className={headerClass}>
        <span className="comor-card-icon">{rec.icon}</span>
        <span className="comor-card-title">{rec.label}</span>
      </div>
      <div className="comor-card-body">
        {rec.items.map((item, i) => (
          <div key={i} className={`comor-point type-${rec.tier}`}>
            <div className="comor-point-heading">{item.heading}</div>
            <div className="comor-point-text">{item.text}</div>
            {item.referral && (
              <div>
                <ResourceLink label={item.referral} variant="comor" />
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

/* ================================================================
   STEP 3: RECOMMENDATIONS
   ================================================================ */
function Step3({ patient, barriers, onBack, onReset }) {
  const output = useMemo(() => generateOutput(patient, barriers), [patient, barriers]);
  const { recs, comorRecs, falseBarriers, geriatricResources, talkingPoints, contextItems } = output;

  const selectedBarrierNames = barrierNames(barriers);
  const priorityRecs = recs.filter(r => r.tier === 'priority');
  const recommendedRecs = recs.filter(r => r.tier === 'recommended');
  const optionRecs = recs.filter(r => r.tier === 'option');
  const infoRecs = recs.filter(r => r.tier === 'information');

  return (
    <div>
      {/* Summary Patient Card */}
      <div className="summary-patient-card">
        <div className="spc-title"> Patient Context Summary</div>
        <div style={{display:'flex', flexWrap:'wrap', gap:'16px'}}>
          <div>
            <div className="spc-row"><span className="spc-key">Age:</span><span className="spc-val">{patient.age === '>=65' ? '65 and Over' : 'Under 65'}</span></div>
            <div className="spc-row"><span className="spc-key">Living Environment:</span><span className="spc-val">{livingEnvLabel(patient.livingEnv)}</span></div>
            <div className="spc-row"><span className="spc-key">Prognosis:</span><span className="spc-val">{prognosisLabel(patient.prognosis)}</span></div>
            <div className="spc-row"><span className="spc-key">Insurance:</span><span className="spc-val">{insuranceLabel(patient.insurance)}</span></div>
          </div>
          <div>
            <div className="spc-row"><span className="spc-key">Location:</span><span className="spc-val">{locationLabel(patient.location)}</span></div>
            {patient.comorbidities?.length > 0 && <div className="spc-row"><span className="spc-key">Comorbidities:</span><span className="spc-val">{patient.comorbidities.length} selected</span></div>}
            {selectedBarrierNames.length > 0 && <div className="spc-row"><span className="spc-key">Barriers Identified:</span><span className="spc-val">{selectedBarrierNames.join(', ')}</span></div>}
          </div>
        </div>
      </div>

      {/* Intro narrative */}
      <div className="rec-intro">
        <div className="rec-intro-title">Discharge Options, Resources, and Talking Points for Clinician-Patient Interactions</div>
        {selectedBarrierNames.length > 0 ? (
          <div className="rec-intro-text">
            You identified <strong>{selectedBarrierNames.join(', ')}</strong> as discharge barrier{selectedBarrierNames.length > 1 ? 's' : ''}.
            {contextItems.length > 0 && <> In context of <strong>{contextItems.join(', ')}</strong>.</>}
            {' '}Based on this information, options for discharge for the CCL + MRP to discuss with patient and family are outlined below, ranked by priority tier.
          </div>
        ) : (
          <div className="rec-intro-text">No discharge barriers were selected. Proceed with standard discharge planning. If insurance or location rules apply, they are shown below.</div>
        )}
      </div>

      {/* ── POLICY & CONTACT BACKBONE (persistent) ── */}
      <div className="backbone-section">
        <div className="backbone-grid">
          {/* Policy Backbone tile */}
          <div className="backbone-tile">
            <div className="backbone-tile-head"> Policy Backbone</div>
            <div className="backbone-tile-body">
              <div className="backbone-row"><ResourceLink label="Discharge Planning — ADM VIII 100" /></div>
              <div className="backbone-row"><ResourceLink label="Inpatient Discharge — C-SOP VIII 840" /></div>
              <div className="backbone-row"><ResourceLink label="Discharge Policy Presentation" /></div>
              <div className="backbone-row"><ResourceLink label="Home First (TOH Hub)" /></div>
              <div className="backbone-row">
                <span className="backbone-sub">Provincial references:</span>
                <ResourceLink label="OHA — Bill 7 FAQ (More Beds, Better Care Act)" small />
                <ResourceLink label="Ontario — Hospital Chronic Care Co-Payment" small />
              </div>
            </div>
          </div>
          {/* Who to Call tile */}
          <div className="backbone-tile alt">
            <div className="backbone-tile-head"> Who to Call</div>
            <div className="backbone-tile-body">
              <div className="backbone-row">
                <span className="backbone-label">Discharge Planning Coordinators (DPC):</span>
                <ContactButton kind="mailto" value="dpc@toh.ca" label="dpc@toh.ca" />
              </div>
              <div className="backbone-row">
                <span className="backbone-label">YourCare@Home:</span>
                <ContactButton kind="mailto" value="yourcare@toh.ca" label="yourcare@toh.ca" />
              </div>
              <div className="backbone-row">
                <span className="backbone-label">Ontario Health atHome:</span>
                <ContactButton kind="tel" value="1-833-515-1234" label="1-833-515-1234" verified={true} />
                <span className="backbone-sub">Champlain (per internal doc): 1-800-538-0520 · local 613-745-5525 — confirm locally. Verified provincial line shown above.</span>
              </div>
              <div className="backbone-row">
                <span className="backbone-label">Escalation supports:</span>
                <ResourceLink label="JDO — Joint Discharge Operations" small />
                <ResourceLink label="Complex Discharge Panel" small />
                <ResourceLink label="Tiger Team" small />
              </div>
            </div>
          </div>
        </div>
      </div>

      {/* ── CONTEXT-SENSITIVE ESCALATION & POLICY SUPPORTS ── */}
      {(() => {
        const showDisagree = barriers.disagreement?.selected;
        const showBehaviours = barriers.behaviours?.selected;
        const showUnhoused = barriers.unhoused?.selected || patient.livingEnv === 'shelter';
        const showLtc = barriers.careNeeds?.selected || patient.livingEnv === 'ltc' || barriers.mobility?.likelyImprove === 'no';
        if (!(showDisagree || showBehaviours || showUnhoused || showLtc)) return null;
        return (
          <div className="escalation-panel">
            <div className="escalation-head"> Escalation &amp; Policy Supports — surfaced for your selections</div>
            <div className="escalation-body">
              <div className="escalation-intro">These resource bundles appear because of the barriers you selected. They map the right policy, ethics, capacity, and escalation supports to each situation.</div>

              {showDisagree && (
                <div className="escalation-bundle">
                  <div className="escalation-bundle-title"><span className="eb-trigger">Disagreement / Delay</span> Capacity &amp; Consent and Capacity Board</div>
                  <div className="escalation-chips">
                    <ResourceLink label="Medical Holds & Capacity Assessment Guidance (2025)" small />
                    <ResourceLink label="Preparing for a Consent & Capacity Board (CCB)" small />
                    <ResourceLink label="Consent to Treatment — ADM VIII 200" small />
                    <ResourceLink label="Discharge Planning — ADM VIII 100" small />
                  </div>
                </div>
              )}

              {showBehaviours && (
                <div className="escalation-bundle">
                  <div className="escalation-bundle-title"><span className="eb-trigger">Behaviours</span> Rights, ethics &amp; substance-use policy</div>
                  <div className="escalation-chips">
                    <ResourceLink label="Patient Rights and Responsibilities" small />
                    <ResourceLink label="Ethics Consultations & Frameworks — ADM-01-101" small />
                    <ResourceLink label="Staff Substance Use — ADM X 380" small />
                    <ResourceLink label="Smoke-Free Hospital — ADM IX 140" small />
                    <ResourceLink label="Cannabis for Medical Purpose — ADM VIII 790" small />
                  </div>
                </div>
              )}

              {showUnhoused && (
                <div className="escalation-bundle">
                  <div className="escalation-bundle-title"><span className="eb-trigger">Unhoused / Shelter</span> Ethics &amp; community supports</div>
                  <div className="escalation-chips">
                    <ResourceLink label="Ethics Consultations & Frameworks — ADM-01-101" small />
                    <ResourceLink label="Inner City Health / Shelter Resources" small />
                  </div>
                </div>
              )}

              {showLtc && (
                <div className="escalation-bundle">
                  <div className="escalation-bundle-title"><span className="eb-trigger">ALC / LTC trajectory · high care needs</span> Long-stay escalation</div>
                  <div className="escalation-chips">
                    <ContactButton kind="mailto" value="dpc@toh.ca" label="DPC — dpc@toh.ca" />
                    <ResourceLink label="JDO — Joint Discharge Operations" small />
                    <ResourceLink label="Complex Discharge Panel" small />
                    <ResourceLink label="Tiger Team" small />
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      })()}

      {/* Geriatric Banner */}
      {geriatricResources.length > 0 && (
        <div className="geriatric-banner">
          <span></span>
          <div>
            <strong>Geriatric-Specific Resources (Age ≥ 65)</strong><br/>
            <div style={{marginTop:4, fontSize:'0.83rem', fontWeight:300}}>
              {geriatricResources.map((r,i) => <div key={i}>• {r}</div>)}
            </div>
          </div>
        </div>
      )}

      {/* False Barriers */}
      {falseBarriers.length > 0 && (
        <div>
          {falseBarriers.map((fb, i) => (
            <div key={i} className="rec-block tier-warning">
              <div className="rec-block-header">
                <span className="rec-tier-badge"> FALSE BARRIER</span>
                <span className="rec-block-title">{fb.label}</span>
              </div>
              <div className="rec-block-body">
                <div className="rec-item-text">{fb.message}</div>
              </div>
            </div>
          ))}
        </div>
      )}

      {/* Priority Recs */}
      {priorityRecs.length > 0 && (
        <div>
          <div style={{fontSize:'0.82rem', fontWeight:700, color:'#112742', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:8, marginTop:8}}> Priority Actions</div>
          {priorityRecs.map(r => <RecBlock key={r.key} rec={r} />)}
        </div>
      )}

      {/* Recommended Recs */}
      {recommendedRecs.length > 0 && (
        <div>
          <div style={{fontSize:'0.82rem', fontWeight:700, color:'#295d90', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:8, marginTop:16}}> Recommended Pathways</div>
          {recommendedRecs.map(r => <RecBlock key={r.key} rec={r} />)}
        </div>
      )}

      {/* Option Recs */}
      {optionRecs.length > 0 && (
        <div>
          <div style={{fontSize:'0.82rem', fontWeight:700, color:'#70b9c6', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:8, marginTop:16}}> Additional Options</div>
          {optionRecs.map(r => <RecBlock key={r.key} rec={r} />)}
        </div>
      )}

      {/* Information Recs */}
      {infoRecs.length > 0 && (
        <div>
          <div style={{fontSize:'0.82rem', fontWeight:700, color:'#414042', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:8, marginTop:16}}> Information & Notes</div>
          {infoRecs.map(r => <RecBlock key={r.key} rec={r} />)}
        </div>
      )}

      {/* ── COMORBIDITY-SPECIFIC CONSIDERATIONS ── */}
      <div style={{marginTop: infoRecs.length > 0 ? 24 : 16}}>
        <div className="comor-section-header">
          <span style={{fontSize:'1.1rem'}}></span>
          <span className="csh-title">Comorbidity-Specific Considerations</span>
          {comorRecs.length > 0
            ? <span className="csh-count">{comorRecs.length} active</span>
            : <span className="csh-count">none selected</span>
          }
        </div>
        {comorRecs.length > 0 ? (
          <div className="comor-grid">
            {comorRecs.map(r => <ComorCard key={r.key} rec={r} />)}
          </div>
        ) : (
          <div className="comor-none-note">
            No comorbidities were selected in the patient profile. If the patient has relevant comorbidities, return to Step 1 and select them — this section will populate with condition-specific discharge guidance.
          </div>
        )}
      </div>

      {/* Policy Box */}
      <div className="policy-box" style={{marginTop:20}}>
        <div className="policy-box-title"> TOH Discharge Policy — Decision Timelines</div>
        <div className="policy-box-text">
          <strong>48-Hour Rule:</strong> Once a patient is medically cleared for discharge, patients and families have <strong>48 hours</strong> to reach a decision on discharge options, including selection of a retirement home. Refer to TOH Discharge Policy.<br/><br/>
          <strong>24-Hour Rule:</strong> CCL and Allied Health are expected to submit required applications for discharge planning (e.g., SVH PCU, rehab) within <strong>24 hours</strong> of being requested. If the CCL or Allied Health for the unit is away, the unit manager must arrange coverage.<br/><br/>
          <strong>Escalation:</strong> If a medically stable patient/family does not participate in discharge planning, TOH Discharge Policy supports escalating the case to the unit director for possible application of a daily co-payment. <ResourceLink label="TOH Discharge Policy (SharePoint)" />
        </div>
      </div>

      {/* Talking Points */}
      <div className="talking-points">
        <div className="talking-points-header"> Talking Points & Resources — Clinician-Patient Interaction Guide</div>
        <div className="talking-points-body">
          <div style={{fontSize:'0.82rem', color:'#707372', marginBottom:10}}>The following resources are pulled based on barriers identified and relevant comorbidities selected:</div>
          {talkingPoints.map((tp, i) => (
            <div key={i} className="tp-item">
              <span className="tp-dot"></span>
              <div>
                {tp.text}
                {tp.referral && <> — <ResourceLink label={tp.referral} small /></>}
              </div>
            </div>
          ))}
        </div>
      </div>

      <div className="step-actions">
        <div style={{display:'flex', gap:10}}>
          <button className="btn-secondary" onClick={onBack}>← Back to Barriers</button>
          <button className="btn-danger" onClick={onReset}>↺ Start New Patient</button>
        </div>
        <button className="print-btn" onClick={() => window.print()}> Print / Export PDF</button>
      </div>
    </div>
  );
}

function DischargeIQ() {
  const [step, setStep] = useState(1);
  const [patient, setPatient] = useState({
    age: '', livingEnv: '', mobility: '', prognosis: '', careNeeds: [],
    transport: '', insurance: '', location: '', comorbidities: [],
  });
  const [barriers, setBarriers] = useState({
    mobility: { selected: false },
    livingEnv: { selected: false },
    palliative: { selected: false },
    disagreement: { selected: false },
    behaviours: { selected: false },
    specialty: { selected: false },
    awaitingTest: { selected: false },
    awaitingMAID: { selected: false },
    unhoused: { selected: false },
    careNeeds: { selected: false },
  });

  const handleReset = () => {
    setStep(1);
    setPatient({ age: '', livingEnv: '', mobility: '', prognosis: '', careNeeds: [], transport: '', insurance: '', location: '', comorbidities: [] });
    setBarriers({
      mobility: { selected: false }, livingEnv: { selected: false }, palliative: { selected: false },
      disagreement: { selected: false }, behaviours: { selected: false }, specialty: { selected: false },
      awaitingTest: { selected: false }, awaitingMAID: { selected: false }, unhoused: { selected: false }, careNeeds: { selected: false },
    });
    window.scrollTo(0,0);
  };

  const stepStatus = (s) => {
    if (s === step) return 'active';
    if (s < step) return 'completed';
    return 'inactive';
  };

  return (
    <div>
      {/* HEADER */}
      <div className="app-header">
        <div className="header-inner">
          <div className="header-logo">
            <svg className="header-logo-cross" viewBox="0 0 40 40" fill="none">
              <rect x="14" y="2" width="12" height="36" rx="3" fill="#70b9c6" opacity="0.9"/>
              <rect x="2" y="14" width="36" height="12" rx="3" fill="#70b9c6" opacity="0.9"/>
              <rect x="16" y="4" width="8" height="32" rx="2" fill="white" opacity="0.3"/>
            </svg>
            <div>
              <div style={{fontSize:'0.75rem', fontWeight:300, color:'#c6e3e8', letterSpacing:'0.06em', textTransform:'uppercase'}}>The Ottawa Hospital</div>
              <div style={{fontSize:'0.65rem', fontWeight:300, color:'rgba(198,227,232,0.7)', letterSpacing:'0.04em'}}>L'Hôpital d'Ottawa</div>
            </div>
          </div>
          <div className="header-title-block">
            <div className="header-title">DischargeIQ</div>
            <div className="header-subtitle">Clinical Discharge Decision Aid — CCL/MRP Tool</div>
          </div>
          <div className="header-badge">CCL/MRP Dyad Tool</div>
        </div>
      </div>

      {/* PROGRESS BAR */}
      <div className="progress-bar-wrap">
        <div className="progress-bar-inner">
          {[
            { n: 1, label: 'Patient\nProfile' },
            { n: 2, label: 'Discharge\nBarriers' },
            { n: 3, label: 'Expert\nRecommendations' },
          ].map(s => (
            <div key={s.n} className="progress-step">
              <span className={`progress-num ${stepStatus(s.n)}`}>{s.n}</span>
              <span className={`progress-label ${stepStatus(s.n)}`}>{s.label.replace('\n', ' ')}</span>
            </div>
          ))}
        </div>
      </div>

      {/* MAIN */}
      <div className="main-content">
        {step === 1 && <Step1 patient={patient} setPatient={setPatient} onNext={() => { setStep(2); window.scrollTo(0,0); }} />}
        {step === 2 && <Step2 barriers={barriers} setBarriers={setBarriers} patient={patient} onBack={() => { setStep(1); window.scrollTo(0,0); }} onNext={() => { setStep(3); window.scrollTo(0,0); }} />}
        {step === 3 && <Step3 patient={patient} barriers={barriers} onBack={() => { setStep(2); window.scrollTo(0,0); }} onReset={handleReset} />}
      </div>

      {/* FOOTER */}
      <div className="app-footer">
        <strong>DischargeIQ Clinical Discharge Decision Aid</strong> — The Ottawa Hospital | L'Hôpital d'Ottawa<br/>
        <span>For use by CCL/MRP Dyad during inpatient discharge planning. For clinical guidance only. All recommendations subject to MRP clinical judgment and current TOH policy.</span>
      </div>
    </div>
  );
}

ReactDOM.render(React.createElement(DischargeIQ), document.getElementById('root'));
</script>
</body>
</html>
